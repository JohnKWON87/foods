<!--
📌 전체 구조
네비게이션 바를 다른 페이지에서 재사용할 수 있는 **Fragment(조각)**로 만든 Thymeleaf 템플릿입니다.
주요 특징:

Thymeleaf Fragment (재사용 가능)
Spring Security 통합 (권한별 표시)
반응형 디자인 (모바일 햄버거 메뉴)
CSRF 보호 -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>
<!-- 🎯 파트 1: 문서 헤더
1️⃣ DOCTYPE & Namespace 선언
역할: HTML5 문서 선언 + Thymeleaf 네임스페이스
네임스페이스 설명:
htmlxmlns:th="http://www.thymeleaf.org"
Thymeleaf 전용 속성 사용 가능
예: th:href, th:text, th:if

xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
 Spring Security 전용 속성 사용 가능
 예: sec:authorize, sec:authentication
 -->

<!-- 네비게이션 바 Fragment -->
<nav th:fragment="navbar" class="navbar">
<!--    🧩 파트 2: Fragment 정의-->
<!--    2️⃣ Fragment 선언-->
<!--    역할: 이 nav를 "navbar"라는 이름의 재사용 가능한 조각으로 정의-->
<!--    다른 페이지에서 사용법:-->
<!--    html&lt;!&ndash; main.html &ndash;&gt;-->
<!--    <!DOCTYPE html>-->
<!--    <html xmlns:th="http://www.thymeleaf.org">-->
<!--    <head>...</head>-->
<!--    <body>-->
<!--    &lt;!&ndash; navbar.html의 navbar 조각 삽입 &ndash;&gt;-->
<!--    <div th:replace="~{fragments/navbar :: navbar}"></div>-->

<!--    <main>-->
<!--        메인 콘텐츠...-->
<!--    </main>-->
<!--    </body>-->
<!--    </html>-->
<!--    Fragment 문법:-->
<!--    html&lt;!&ndash; 정의 &ndash;&gt;-->
<!--    <div th:fragment="이름">...</div>-->

<!--    &lt;!&ndash; 사용 &ndash;&gt;-->
<!--    <div th:replace="~{파일경로 :: 이름}"></div>-->
<!--    <div th:insert="~{파일경로 :: 이름}"></div>-->

<!--    &lt;!&ndash; replace vs insert &ndash;&gt;-->
<!--    replace: 해당 태그를 완전히 교체-->
<!--    insert: 해당 태그 안에 삽입-->


<!--    🎨 파트 3: 네비게이션 구조-->
<!--    3️⃣ 컨테이너 & 로고-->
    <div class="navbar-container">
        <!-- 로고 -->
        <div class="navbar-brand">
            <a th:href="@{/}">🍽️ 맛집추천</a>
        </div>
<!--        th:href="@{/}" 설명:-->
<!--        html&lt;!&ndash; Thymeleaf URL 표현식 &ndash;&gt;-->
<!--        th:href="@{/}"              → "/"-->
<!--        th:href="@{/restaurants}"   → "/restaurants"-->
<!--        th:href="@{/board/{id}(id=${board.id})}" → "/board/123"-->

<!--        &lt;!&ndash; 일반 HTML (권장 안 함) &ndash;&gt;-->
<!--        href="/"  &lt;!&ndash; 컨텍스트 패스 무시 &ndash;&gt;-->

<!--        &lt;!&ndash; Thymeleaf 사용 시 장점 &ndash;&gt;-->
<!--        - 컨텍스트 패스 자동 추가-->
<!--        - URL 파라미터 처리-->
<!--        - 상대/절대 경로 자동 처리-->
<!--        ```-->

<!--        **컨텍스트 패스 예시**:-->
<!--        ```-->
<!--        개발: localhost:8080/ → th:href="@{/}" → "/"-->
<!--        배포: example.com/myapp/ → th:href="@{/}" → "/myapp/"-->

<!--        4️⃣ 햄버거 버튼 (모바일용)-->
        <!-- ✅ 여기에 추가! 햄버거 버튼 모바일용-->
<!--        역할: 모바일에서 메뉴를 펼치는 버튼-->
        <button class="navbar-toggle" id="navbarToggle" aria-label="메뉴 열기">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- 메뉴 -->
        <div class="navbar-menu" id="navbarMenu">
            <!-- 누구나 볼 수 있는 메뉴 -->
            <a th:href="@{/}" class="nav-link">홈</a>
            <a th:href="@{/restaurants}" class="nav-link">맛집 목록</a>
            <a th:href="@{/boards}" class="nav-link">자유게시판</a>

            <!-- ✅ 관리자 메뉴 추가 -->
            <a th:href="@{/admin}"
               sec:authorize="hasRole('ADMIN')"
               style="background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%); color: white; padding: 8px 16px; border-radius: 8px; font-weight: 600;">
                🔧 관리자
            </a>

            <!-- 로그인한 사용자만 표시 -->
            <a sec:authorize="isAuthenticated()"
               th:href="@{/bookmarks}"
               class="nav-link nav-bookmark">
                ❤️ 북마크
            </a>

            <!-- 로그인한 사용자만 보이는 메뉴 -->
            <a sec:authorize="isAuthenticated()" th:href="@{/restaurants/new}" class="nav-link">맛집 등록</a>

            <!-- 관리자만 보이는 메뉴 -->
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" class="nav-link nav-admin">
                👑 관리자
            </a>
        </div>

        <!-- 사용자 정보 & 인증 버튼 -->
        <div class="navbar-user" id="navbarUser">
            <!-- 비로그인 상태 -->
            <div sec:authorize="!isAuthenticated()" class="auth-buttons">
                <a th:href="@{/login}" class="btn-login">로그인</a>
                <a th:href="@{/signup}" class="btn-signup">회원가입</a>
            </div>

            <!-- 로그인 상태 -->
            <div sec:authorize="isAuthenticated()" class="user-info">
                <span class="username">
                    <span sec:authorize="hasRole('ADMIN')" style="color: #e74c3c;">👑</span>
                    <span sec:authentication="principal.username"></span>님
                </span>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn-logout">로그아웃</button>
                </form>
            </div>
        </div>
    </div>
</nav>
<!-- 🍔 햄버거 메뉴 스크립트 -->
<script th:src="@{/js/navbar.js}"></script>
</body>
</html>
