<!-- 회원가입 페이지
실시간 검증 (아이디, 비밀번호, 이메일 중복 체크)
에러 메시지 표시-->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 맛집 추천</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="signup-page">
<div class="auth-container">

    <div class="auth-card">
        <h2>회원가입</h2>



        <!-- 에러 메시지 -->
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <!-- 회원가입 폼 -->
        <form method="post" th:action="@{/signup}" id="signupForm">

            <!-- 아이디 -->
            <div class="form-group">
                <label for="username">아이디</label>
                <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="4~20자 영문/숫자"
                        th:value="${username}"
                        required
                >
                <div id="usernameMessage" class="form-message"></div>
            </div>

            <!-- 비밀번호 -->
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="8자 이상"
                        required
                >
            </div>

            <!-- 비밀번호 확인 -->
            <div class="form-group">
                <label for="passwordConfirm">비밀번호 확인</label>
                <input
                        type="password"
                        id="passwordConfirm"
                        name="passwordConfirm"
                        placeholder="비밀번호 재입력"
                        required
                >
                <div id="passwordMessage" class="form-message"></div>
            </div>

            <!-- 이메일 -->
            <div class="form-group">
                <label for="email">이메일</label>
                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        th:value="${email}"
                        required
                >
                <div id="emailMessage" class="form-message"></div>
            </div>

            <!-- 제출 버튼 -->
            <button type="submit" class="btn btn-primary btn-block">가입하기</button>
        </form>

        <!-- 로그인 링크 -->
        <p class="auth-link">
            이미 계정이 있으신가요? <a href="/login">로그인</a>
        </p>
    </div>
</div>

<script th:src="@{/js/signup.js}"></script>
</body>
</html>
