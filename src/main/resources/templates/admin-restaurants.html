<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맛집 관리 - 관리자</title>
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<!-- 네비게이션 바 -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="admin-container">
    <div class="admin-header">
        <h1>🍽️ 맛집 관리</h1>
        <a th:href="@{/admin}" class="btn-back">← 대시보드로</a>
    </div>

    <!-- 성공/에러 메시지 -->
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <!-- 맛집 목록 -->
    <div class="admin-section">
        <h2>📋 전체 맛집 목록 (<span th:text="${#lists.size(restaurants)}">0</span>개)</h2>

        <div class="table-wrapper">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>맛집명</th>
                    <th>카테고리</th>
                    <th>주소</th>
                    <th>작성자</th>
                    <th>조회수</th>
                    <th>등록일</th>
                    <th>관리</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="restaurant : ${restaurants}">
                    <td th:text="${restaurant.id}">1</td>
                    <td>
                        <a th:href="@{/restaurants/{id}(id=${restaurant.id})}"
                           th:text="${restaurant.name}"
                           target="_blank">
                            맛집이름
                        </a>
                    </td>
                    <td th:text="${restaurant.category}">한식</td>
                    <td th:text="${restaurant.address}">서울시 강남구</td>
                    <td th:text="${restaurant.author != null ? restaurant.author.username : '-'}">작성자</td>
                    <td th:text="${restaurant.viewCount != null ? restaurant.viewCount : 0}">0</td>
                    <td th:text="${#temporals.format(restaurant.createdAt, 'yyyy-MM-dd')}">2024-01-01</td>
                    <td>
                        <div class="action-buttons">
                            <!-- 수정 -->
                            <a th:href="@{/restaurants/{id}/edit(id=${restaurant.id})}"
                               class="btn-action btn-primary"
                               target="_blank">
                                ✏️ 수정
                            </a>

                            <!-- 삭제 -->
                            <form th:action="@{/restaurants/{id}/delete(id=${restaurant.id})}"
                                  method="post"
                                  style="display: inline;"
                                  onsubmit="return confirm('정말 삭제하시겠습니까?\n\n⚠️ 이 맛집의 모든 이미지도 함께 삭제됩니다.');">
                                <button type="submit" class="btn-action btn-danger">🗑️ 삭제</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(restaurants)}">
                    <td colspan="8" style="text-align: center; color: #999; padding: 40px;">
                        등록된 맛집이 없습니다.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 통계 -->
    <div class="admin-stats">
        <div class="stat-item">
            <span class="stat-label">전체 맛집:</span>
            <span class="stat-value" th:text="${#lists.size(restaurants)} + '개'">0개</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">한식:</span>
            <span class="stat-value" th:text="${#lists.size(restaurants.?[category == '한식'])} + '개'">0개</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">중식:</span>
            <span class="stat-value" th:text="${#lists.size(restaurants.?[category == '중식'])} + '개'">0개</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">일식:</span>
            <span class="stat-value" th:text="${#lists.size(restaurants.?[category == '일식'])} + '개'">0개</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">양식:</span>
            <span class="stat-value" th:text="${#lists.size(restaurants.?[category == '양식'])} + '개'">0개</span>
        </div>
    </div>

    <!-- 안내 -->
    <div class="admin-info">
        <h3>⚠️ 주의사항</h3>
        <ul>
            <li>맛집 삭제 시 해당 맛집의 모든 이미지가 함께 삭제됩니다.</li>
            <li>삭제된 맛집은 복구할 수 없습니다.</li>
            <li>수정은 새 탭에서 열립니다.</li>
        </ul>
    </div>
</div>

<footer>
    <p>&copy; 2025 맛집 추천 | <a th:href="@{/admin}">관리자 대시보드</a></p>
</footer>

<script th:src="@{/js/admin.js}"></script>
</body>
</html>
